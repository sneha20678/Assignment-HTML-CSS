
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
        }

        /* Flexbox: Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #243b6b;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        /* Flexbox: Hero section */
        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
            background: #dce7ff;
        }

        .hero h1 {
            color: #243b6b;
            margin-bottom: 15px;
        }

        .hero p {
            margin-bottom: 20px;
        }

        button {
            background: #243b6b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
        }

        /* Grid: Cards section */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #cccccc;
        }

        .card h2 {
            color: #243b6b;
            margin-bottom: 10px;
        }

        footer {
            background: #243b6b;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Responsive design */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 12px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>My Website</h2>
        <div>
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <div>
            <h1>Welcome to My Website</h1>
            <p>Learn new skills and build your future with us.</p>
            <button>Get Started</button>
        </div>
    </section>

    <section class="cards" id="services">
        <div class="card">
            <h2>HTML</h2>
            <p>Learn to create web pages.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn to style your web pages.</p>
        </div>

        <div class="card">
            <h2>Responsive</h2>
            <p>Make websites work on mobile.</p>
        </div>
    </section>

    <footer id="contact">
        <p>My Landing Page | Thank You</p>
    </footer>

</body>
</html>
