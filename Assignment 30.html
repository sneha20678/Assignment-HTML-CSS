
<!DOCTYPE html>
<html>
<head>
    <title>My Profile Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
            padding: 30px;
        }

        .card {
            background-color: white;
            width: 280px;
            margin: auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        .profile {
            background-color: navy;
            color: white;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: auto;
            line-height: 100px;
            font-size: 35px;
        }

        h2 {
            color: navy;
        }

        p {
            color: gray;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="profile">S</div>

        <h2>Sneha</h2>
        <p>BCA Student</p>
        <p>Learning HTML and CSS</p>

        <button>View Profile</button>
    </div>

</body>
</html>
