
<!DOCTYPE html>
<html>
<head>
    <title>Semantic HTML Page</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f4f8;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: lightblue;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: navy;
            text-decoration: none;
            margin: 10px;
        }

        main {
            padding: 20px;
        }

        section {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to My Page</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Welcome to my website.</p>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>I am a BCA student learning HTML and CSS.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Thank you for visiting my page.</p>
        </section>
    </main>

    <footer>
        <p>My Website | 2026</p>
    </footer>

</body>
</html>
