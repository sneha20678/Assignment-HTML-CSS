
<!DOCTYPE html>
<html>
<head>
    <title>CSS Transition</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 40px 15px;
        }

        h1 {
            color: navy;
        }

        button {
            background-color: navy;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.5s;
        }

        button:hover {
            background-color: orange;
            color: black;
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <h1>CSS Transition</h1>

    <p>Button par tap ya click karo!</p>

    <button>Click Me</button>

</body>
</html>
