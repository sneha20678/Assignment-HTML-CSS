
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        section {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            color: navy;
        }

        .skill {
            display: inline-block;
            background-color: lightblue;
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            nav a {
                display: block;
                margin: 12px;
            }

            section {
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <header id="home">
        <h1>My Portfolio</h1>
        <p>Hello! I am Sneha</p>
        <p>BCA Student</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="about">
        <h2>About Me</h2>
        <p>I am a BCA student. I am learning web development.</p>
    </section>

    <section id="skills">
        <h2>My Skills</h2>
        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
        <span class="skill">Java</span>
    </section>

    <section id="contact">
        <h2>Contact Me</h2>
        <p>Email: myemail@example.com</p>
    </section>

    <footer>
        <p>My Portfolio | 2026</p>
    </footer>

</body>
</html>
