
<!DOCTYPE html>
<html>
<head>
    <title>My Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px #cccccc;
        }

        .card h2 {
            color: navy;
        }

        .card p {
            color: #444444;
        }

        .basic {
            border-top: 5px solid blue;
        }

        .premium {
            border-top: 5px solid orange;
        }

        button {
            background-color: navy;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>My Card Designs</h1>

    <div class="card basic">
        <h2>Basic Card</h2>
        <p>This is my basic card design.</p>
        <button>Learn More</button>
    </div>

    <div class="card premium">
        <h2>Premium Card</h2>
        <p>This is my premium card design.</p>
        <button>Explore</button>
    </div>

</body>
</html>
