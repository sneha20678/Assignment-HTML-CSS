
<!DOCTYPE html>
<html>
<head>
    <title>CSS Overflow</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
        }

        .box {
            width: 250px;
            height: 120px;
            margin: 30px auto;
            padding: 15px;
            border: 3px solid blue;
            background-color: white;
            overflow: auto;
            text-align: left;
        }

        h1 {
            color: navy;
        }
    </style>
</head>
<body>

    <h1>CSS Overflow Example</h1>

    <div class="box">
        This is a long paragraph to demonstrate CSS overflow.
        When the text becomes larger than the box, the overflow
        property helps us manage the extra content. You can scroll
        inside this box to read the complete paragraph.
    </div>

</body>
</html>
