
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Page Fix</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #222;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 8px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
        }

        .card {
            flex: 1 1 250px;
            min-width: 0;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            .container {
                flex-direction: column;
                padding: 10px;
            }

            .card {
                width: 100%;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Responsive Website</h1>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
    </nav>

    <main class="container" id="home">

        <section class="card" id="about">
            <h2>About Me</h2>
            <p>I am a BCA student learning HTML and CSS.</p>
        </section>

        <section class="card" id="services">
            <h2>My Skills</h2>
            <p>HTML, CSS and Java.</p>
        </section>

        <section class="card">
            <h2>My Project</h2>
            <p>This website adjusts to different screen sizes.</p>
        </section>

    </main>

</body>
</html>
